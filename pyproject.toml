[project]
name = "investfeed-assistant"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis~=0.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
assistant = "app.__main__:main"

# 프로젝트를 패키지로 설치해야 [project.scripts] 진입점이 .venv/bin 에 생긴다 (flat 레이아웃: app/)
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
